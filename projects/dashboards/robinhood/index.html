<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Robinhood Portfolio Dashboard</title>
<link rel="icon" href="data:,"/>
<link rel="stylesheet" href="dash.css?v=2d927a1c6a"/>
</head><body>
<div id="app"><div class="boot">Loading live portfolio data&hellip;</div></div>
<noscript><div class="boot">This dashboard renders its content with JavaScript. Enable it for this site to see your portfolio.</div></noscript>

<script>var DASH_V='2d927a1c6a';</script>
<script>
(function(){
  var PARTS=['part1.html?v='+DASH_V,'part2.html?v='+DASH_V,'part3.html?v='+DASH_V,'part4.html?v='+DASH_V,'part5.html?v='+DASH_V,'part6.html?v='+DASH_V,'part7.html?v='+DASH_V,'part8.html?v='+DASH_V,'part9.html?v='+DASH_V,'part10.html?v='+DASH_V,'part11.html?v='+DASH_V];
  var app=document.getElementById('app');
  function fail(m){
    app.innerHTML='<div style="max-width:760px;margin:60px auto;padding:24px;border:1px solid #3a2430;'
      +'background:#1b212c;border-radius:12px;color:#e7ecf3;font:15px/1.6 -apple-system,Segoe UI,sans-serif">'
      +'<b>This dashboard could not finish loading.</b><br/><br/>'+m
      +'<br/><br/><span style="color:#8b97a8;font-size:13px">Reload the page. If it keeps failing, the '
      +'deploy is mid-flight &mdash; the page shell updated before its content files did.</span></div>';
  }
  Promise.all(PARTS.map(function(u){
    return fetch(u,{credentials:'same-origin',cache:'no-cache'}).then(function(r){
      if(!r.ok) throw new Error(u+' returned HTTP '+r.status);
      return r.text();
    });
  })).then(function(chunks){
    for(var i=0;i<chunks.length;i++){
      if(chunks[i].indexOf('<!DOCTYPE')===0||chunks[i].indexOf('class=')<0){
        return fail('Your Cloudflare Access session expired while the page was loading, so '
          +PARTS[i].split('?')[0]+' came back as a login page instead of portfolio data. '
          +'Sign in again and reload.');
      }
    }
    app.innerHTML=chunks.join('');
    var s=document.createElement('script');
    s.src='dash.js?v='+DASH_V;
    s.onerror=function(){fail('The interactive layer (dash.js) failed to load, so the sliders, '
      +'the rebalance simulator and the sortable columns are inactive. The figures above are still correct.');};
    document.body.appendChild(s);
  }).catch(function(e){ fail(String(e.message||e)); });
})();
</script>
</body></html>
