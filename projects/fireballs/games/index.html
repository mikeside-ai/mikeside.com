<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<script>document.documentElement.classList.add("checking")</script>

<meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
<title>Games &middot; Fireballs U7</title>
<meta name="description" content="Game schedule, RSVPs, snacks and field map for the Fireballs U7 boys.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- PUBLIC REPO. No player names or parent info here. Team data comes from
     /projects/fireballs/api/ behind Cloudflare Access. Styles copied from ../index.html. -->
<style>
/* ============================================
   mikeside.com — STAGE LEFT theme
   + fire accent for this page only
   ============================================ */
:root{
  --bg:#0b1020; --bg-soft:#111730; --card:#151c38;
  --text:#ece5d8; --muted:#9a97a8;
  --accent:#c14b34; --accent-soft:#d9694f;
  --jumpsuit:#f5c542;
  --fire:#ff7a2f;          /* this page only */
  --good:#5cc08a; --warn:#f5c542; --bad:#e0644f;
  --border:#262e4e; --radius:14px; --maxw:1080px;
  --header-bg:rgba(11,16,32,.92); --on-fire:#1a0d05;
  color-scheme:dark;
}
/* Light mode follows the phone or computer setting. Same layout, plaster-light colors. */
@media (prefers-color-scheme: light){
  :root{
    --bg:#f6f2ea; --bg-soft:#efe8dc; --card:#ffffff;
    --text:#1b1f33; --muted:#5d5a6b;
    --accent:#b33a26; --accent-soft:#b33a26;
    --jumpsuit:#8a6100;
    --fire:#c2410c;
    --good:#2f7d52; --warn:#8a6100; --bad:#b33a26;
    --border:#ddd3c3;
    --header-bg:rgba(246,242,234,.92); --on-fire:#ffffff;
    color-scheme:light;
  }
  :root .game,:root .practice,:root .card,:root .tile{box-shadow:0 1px 2px rgba(27,31,51,.05)}
  :root .cta-practice{color:#ffffff}
  :root .snackbox:not(.taken){background:linear-gradient(135deg,rgba(194,65,12,.10),rgba(138,97,0,.08));border-color:var(--fire)}
  :root .snackbox.taken{background:rgba(47,125,82,.08);border-color:rgba(47,125,82,.45)}
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo{font-family:"Fraunces",Georgia,serif}
a{color:var(--accent-soft);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--fire);outline-offset:3px;border-radius:4px}
.container{max-width:var(--maxw);margin:0 auto;padding:0 1rem}

header{position:sticky;top:0;z-index:50;background:var(--header-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 0}
.nav .logo{font-weight:600;font-size:1.15rem;color:var(--text)}
.nav .logo span{color:var(--accent-soft)}
.nav ul{display:flex;gap:1rem;list-style:none;flex-wrap:wrap}
.nav ul a{color:var(--muted);font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em}
.nav ul a:hover{color:var(--text);text-decoration:none}

.hero{padding:3rem 0 2rem;border-bottom:1px solid var(--border)}
.kicker{color:var(--fire);font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.2em}
.hero h1{font-size:clamp(2.4rem,8vw,4rem);line-height:1;margin:.5rem 0 .8rem;letter-spacing:-.02em}
.hero h1 em{font-style:italic;color:var(--fire)}
.hero p.lede{color:var(--muted);max-width:60ch;font-size:1.02rem}

.next{margin-top:1.6rem;background:linear-gradient(135deg,rgba(255,122,47,.16),rgba(193,75,52,.08));border:1px solid rgba(255,122,47,.4);border-radius:var(--radius);padding:1.1rem 1.25rem;display:grid;gap:.25rem}
.next .label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fire);font-weight:600}
.next .big{font-family:"Fraunces",Georgia,serif;font-size:1.5rem;line-height:1.2}
.next .sub{color:var(--muted);font-size:.92rem}

section{padding:2.6rem 0;border-bottom:1px solid var(--border)}
.eyebrow{font-family:"Fraunces",Georgia,serif;font-style:italic;color:var(--accent-soft);font-size:1rem;margin-bottom:.2rem}
section h2{font-size:clamp(1.5rem,4vw,2.1rem);letter-spacing:-.015em;margin-bottom:.4rem}
p.intro{color:var(--muted);max-width:68ch;margin-bottom:1.4rem}

.games{display:grid;gap:.7rem}
.game{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.15rem;display:grid;grid-template-columns:4.6rem 1fr;gap:.9rem;align-items:start}
.game.past{opacity:.5}
.game.is-next{border-color:rgba(255,122,47,.6)}
.game .when{text-align:center;border-right:1px solid var(--border);padding-right:.8rem}
.game .when .mon{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.game .when .day{font-family:"Fraunces",Georgia,serif;font-size:1.7rem;line-height:1}
.game .when .time{font-size:.8rem;color:var(--fire);font-weight:600;margin-top:.2rem;font-variant-numeric:tabular-nums}
.game h3{font-size:1.1rem;line-height:1.3}
.game .meta{color:var(--muted);font-size:.85rem;margin-top:.15rem}
.tag{display:inline-block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:.15rem .5rem;border-radius:999px;border:1px solid var(--border);color:var(--muted);margin-left:.35rem;vertical-align:middle}
.tag.home{color:var(--fire);border-color:rgba(255,122,47,.45)}
.tag.off{color:var(--jumpsuit);border-color:rgba(245,197,66,.4)}
.game .extra{margin-top:.7rem;padding-top:.7rem;border-top:1px solid var(--border);display:grid;gap:.6rem;font-size:.88rem}
.game .extra:empty{display:none}
.game .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .6rem}
.game .date{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;width:100%}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-top:.75rem}
.tile{background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;padding:.6rem .75rem;display:grid;gap:.05rem;color:var(--text)}
a.tile:hover{text-decoration:none;border-color:rgba(255,122,47,.5)}
.tile .k{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:"Fraunces",Georgia,serif;font-size:1.65rem;line-height:1.1;color:var(--fire);font-variant-numeric:tabular-nums}
.tile .s{font-size:.78rem;color:var(--muted)}
.game.past .tile .v{color:var(--muted)}
.snackbox{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .7rem;background:rgba(245,197,66,.07);border:1px dashed rgba(245,197,66,.35);border-radius:12px;padding:.6rem .75rem}
.snackbox.taken{border-style:solid;border-color:rgba(245,197,66,.25)}
.snackbox .lbl{font-weight:600}
.snackbox b{color:var(--jumpsuit);font-weight:600}
.snackbox select{font:inherit;font-size:.9rem;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:.35rem .5rem;max-width:100%}
.btn.sm{font-size:.82rem;padding:.4rem .85rem}
button.link{font:inherit;font-size:.82rem;background:none;border:0;color:var(--accent-soft);cursor:pointer;padding:.2rem 0}
button.btn{border:0;cursor:pointer;font-family:inherit}

.practices{display:grid;gap:.7rem}
.practice{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.95rem 1.15rem}
.practice.past{opacity:.5}
.practice.is-next{border-color:rgba(255,122,47,.6)}
.practice summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:.2rem .8rem;align-items:center}
.practice summary::-webkit-details-marker{display:none}
.practice .pdate{font-family:"Fraunces",Georgia,serif;font-size:1.05rem;white-space:nowrap}
.practice .ptime{font-size:.8rem;color:var(--fire);font-weight:600;white-space:nowrap}
.practice .pfocus{font-weight:500;grid-column:1/-1;color:var(--text)}
.practice .chev{color:var(--muted);transition:transform .15s}
.practice[open] .chev{transform:rotate(90deg)}
.drills{list-style:none;display:grid;gap:.1rem;margin-top:.7rem}
.drills li{display:grid;grid-template-columns:3.4rem 1fr;gap:.8rem;padding:.6rem 0;border-top:1px solid var(--border)}
.drills .min{color:var(--fire);font-weight:600;font-size:.8rem;font-variant-numeric:tabular-nums;padding-top:.1rem}
.drills .name{font-weight:600}
.drills .how{color:var(--muted);font-size:.88rem;margin-top:.1rem}
.ptip{margin-top:.6rem;font-size:.85rem;color:var(--jumpsuit)}
.rsvp-sum{color:var(--muted)}
.rsvp-sum .y{color:var(--good)} .rsvp-sum .n{color:var(--bad)} .rsvp-sum .m{color:var(--warn)}
details.rsvp summary{cursor:pointer;color:var(--accent-soft);font-weight:500;list-style:none}
details.rsvp summary::-webkit-details-marker{display:none}
details.rsvp summary::before{content:"+ ";}
details.rsvp[open] summary::before{content:"\2212  ";}
.rsvp-list{display:grid;gap:.35rem;margin-top:.6rem}
.rsvp-row{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.rsvp-row > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{flex:none}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:.78rem;font-weight:600;background:transparent;color:var(--muted);border:0;padding:.35rem .75rem;cursor:pointer;min-height:32px}
.seg button + button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"][data-s="yes"]{background:rgba(92,192,138,.2);color:var(--good)}
.seg button[aria-pressed="true"][data-s="maybe"]{background:rgba(245,197,66,.18);color:var(--warn)}
.seg button[aria-pressed="true"][data-s="no"]{background:rgba(224,100,79,.2);color:var(--bad)}

.callout{border-left:3px solid var(--fire);background:var(--bg-soft);border-radius:0 var(--radius) var(--radius) 0;padding:1rem 1.2rem;margin:1.2rem 0}
.callout h3{font-size:1.02rem;margin-bottom:.3rem}
.callout p{font-size:.93rem}
.callout p + p{margin-top:.5rem}
.callout.muted{border-left-color:var(--border);color:var(--muted)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.15rem 1.25rem}
.card h3{font-size:1.08rem;margin-bottom:.5rem}
.card ul{list-style:none;display:grid;gap:.45rem;font-size:.92rem}
.card li{padding-left:1rem;position:relative}
.card li::before{content:"\2022";position:absolute;left:0;color:var(--fire)}
.card p{font-size:.92rem;color:var(--muted)}

.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.6rem;list-style:none}
.roster li{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.6rem .8rem;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;font-size:.92rem;padding:.65rem 1.1rem;border-radius:999px;background:var(--fire);color:var(--on-fire)}
.btn:hover{text-decoration:none;filter:brightness(1.08)}

.contacts{width:100%;border-collapse:collapse;font-size:.9rem}
.contacts th,.contacts td{text-align:left;padding:.6rem .5rem;border-bottom:1px solid var(--border);vertical-align:top}
.contacts th{color:var(--muted);font-weight:600;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase}
.contacts td small{display:block;color:var(--muted)}

.join{display:grid;gap:.7rem;max-width:420px;margin-top:.8rem}
.join label{display:grid;gap:.3rem;font-size:.85rem;color:var(--muted)}
.join input{font:inherit;font-size:1rem;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:.6rem .75rem}
.join input:focus{outline:2px solid var(--fire);outline-offset:1px}
.join button{justify-self:start;border:0;cursor:pointer;font:inherit}
.join .err{color:var(--bad);font-size:.85rem;min-height:1.2em}
.map{display:block;width:100%;height:auto;border-radius:var(--radius);border:1px solid var(--border);margin-top:.4rem}
/* Snack sign-up: make it hard to miss */
.snackbox{border-width:2px;padding:.75rem .85rem;font-size:.95rem}
.snackbox:not(.taken){background:linear-gradient(135deg,rgba(255,122,47,.16),rgba(245,197,66,.12));border:2px dashed var(--fire)}
.snackbox.taken{background:rgba(92,192,138,.10);border:2px solid rgba(92,192,138,.45)}
.snackbox.taken b{color:var(--good)}
.snackbox .lbl{font-size:1rem}
.cta-snack{display:inline-flex;align-items:center;gap:.55rem;margin-top:1.3rem;font-weight:700;font-size:1.05rem;padding:.85rem 1.4rem;border-radius:999px;background:var(--fire);color:var(--on-fire);box-shadow:0 0 0 0 rgba(255,122,47,.7);animation:glow 2.2s ease-in-out infinite}
.cta-row{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.3rem}
.cta-row .cta-snack{margin-top:0}
.cta-practice{background:var(--jumpsuit);color:#1a1405;animation-name:glow-y;animation-delay:1.1s}
@keyframes glow-y{0%{box-shadow:0 0 0 0 rgba(245,197,66,.6),0 0 14px rgba(245,197,66,.4)}70%{box-shadow:0 0 0 14px rgba(245,197,66,0),0 0 22px rgba(245,197,66,.3)}100%{box-shadow:0 0 0 0 rgba(245,197,66,0),0 0 14px rgba(245,197,66,.4)}}
@media (prefers-reduced-motion: reduce){.cta-practice{box-shadow:0 0 18px rgba(245,197,66,.5)}}
.cta-snack:hover{text-decoration:none;filter:brightness(1.08)}
.cta-snack small{font-weight:600;font-size:.8rem;opacity:.85}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,122,47,.65),0 0 14px rgba(255,122,47,.45)}70%{box-shadow:0 0 0 14px rgba(255,122,47,0),0 0 22px rgba(255,122,47,.35)}100%{box-shadow:0 0 0 0 rgba(255,122,47,0),0 0 14px rgba(255,122,47,.45)}}
@media (prefers-reduced-motion: reduce){.cta-snack{animation:none;box-shadow:0 0 18px rgba(255,122,47,.5)}}
.acct-link{display:none;font-size:.8rem;font-weight:600;color:var(--muted)}
@media (max-width:560px){.acct-link{display:inline}}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:999px;padding:.5rem 1rem;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

footer{padding:2.2rem 0 3rem;color:var(--muted);font-size:.84rem}
footer a{color:var(--muted)}
[hidden]{display:none!important}

@media (max-width:560px){
  .nav ul{display:none}
  .game{grid-template-columns:3.8rem 1fr;gap:.7rem;padding:.9rem}
  .game .when{padding-right:.6rem}
  .contacts td:nth-child(2){white-space:normal}
  .seg button{padding:.35rem .55rem}
}
@media (max-width:560px){.nav ul a{font-size:.68rem;letter-spacing:.06em}.nav ul{gap:.75rem}}
</style>
<style>
a.game{display:block;color:var(--text)}
a.game:hover{text-decoration:none;border-color:rgba(255,122,47,.6)}
.game .more{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-top:.7rem;font-size:.85rem;color:var(--muted)}
.game .more .go{color:var(--accent-soft);font-weight:600}
.detail{display:grid;gap:1rem}
.mapwrap{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.mapwrap img{display:block;width:100%;height:auto}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
.hl{fill:rgba(255,122,47,.35);stroke:#ff7a2f;stroke-width:14;filter:drop-shadow(0 0 10px rgba(255,122,47,.9));animation:pulse 1.6s ease-in-out infinite}
.hl-label{fill:#fff;font:700 54px Inter,sans-serif;paint-order:stroke;stroke:#c2410c;stroke-width:10}
@keyframes pulse{0%,100%{fill-opacity:.25;stroke-opacity:1}50%{fill-opacity:.55;stroke-opacity:.6}}
@media (prefers-reduced-motion: reduce){.hl{animation:none}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.15rem}
.panel h3{font-size:1.1rem;margin-bottom:.6rem}
.rsvp-list.big .rsvp-row{padding:.35rem 0;border-top:1px solid var(--border)}
.rsvp-list.big .rsvp-row:first-child{border-top:0}
.rsvp-row .mine{font-size:.7rem;color:var(--fire);font-weight:600;margin-left:.35rem}
.backlink{display:inline-block;margin-bottom:.4rem;font-size:.9rem}
.counts{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:.7rem}
.counts .pill{border:1px solid var(--border);border-radius:999px;padding:.25rem .7rem;font-size:.82rem;background:var(--bg-soft)}
</style>
</head>
<body>

<header>
  <div class="container nav">
    <a class="logo" href="/">mike<span>side</span></a>
    <ul style="display:flex"><li><a href="../">&larr; Team page</a></li><li><a href="../account/">Account</a></li></ul>
  </div>
</header>

<main>
  <div class="hero" id="hero">
    <div class="container">
      <span class="kicker">Fireballs &middot; U7 Boys &middot; Fall 2026</span>
      <h1 id="h1">All <em>games</em></h1>
      <p class="lede" id="lede">Saturdays at Trace Crossings. Tap a game for the field map, snacks and who's coming.</p>
    </div>
  </div>
  <section style="border-bottom:0">
    <div class="container">
      <div id="list" class="games"></div>
      <div id="detail" class="detail" hidden></div>
      <div id="note" class="callout muted" hidden><h3>Parent area</h3><p id="note-msg"></p></div>
    </div>
  </section>
</main>

<footer><div class="container"><p>A <a href="/">mikeside.com</a> project. Go Fireballs.</p></div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/projects/fireballs/games-data.js"></script>
<script>
var API="/projects/fireballs/api/";
var team=null, snackEdit=null;
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function dt(d){var p=d.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("show");},1800);}
function addMin(t,m){var x=t.match(/(\d+):(\d+)\s*(AM|PM)/);var h=+x[1]%12+(x[3]==="PM"?12:0),mm=h*60+(+x[2])+m;h=Math.floor(mm/60);mm=mm%60;return ((h%12)||12)+":"+(mm<10?"0":"")+mm+" "+(h>=12?"PM":"AM");}
function nameOf(id){if(!team)return "";for(var i=0;i<team.players.length;i++) if(team.players[i].id===id) return team.players[i].display; return "";}
function snackFor(d){if(!team)return null;for(var i=0;i<team.snacks.length;i++) if(team.snacks[i].game_date===d) return team.snacks[i].player_id; return null;}
function rsvpFor(d,pid){for(var i=0;i<team.rsvps.length;i++){var r=team.rsvps[i]; if(r.game_date===d&&r.player_id===pid) return r.status;} return null;}
function counts(d){var c={yes:0,maybe:0,no:0}; team.players.forEach(function(p){var s=rsvpFor(d,p.id); if(s) c[s]++;}); c.none=team.players.length-c.yes-c.maybe-c.no; return c;}
function dateLabel(g){var d=dt(g.d);return DOW[d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate();}
function post(path,body){return fetch(API+path,{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify(body)}).then(function(r){if(!r.ok) throw 0; return r.json();});}
function current(){var g=new URLSearchParams(location.search).get("g"); for(var i=0;i<GAMES.length;i++) if(GAMES[i].d===g && !GAMES[i].off) return GAMES[i]; return null;}

function tiles(g){
  return '<div class="tiles"><div class="tile"><span class="k">Kickoff</span><span class="v">'+g.t+'</span><span class="s">Arrive by '+addMin(g.t,-15)+'</span></div>'+
    '<div class="tile"><span class="k">Field</span><span class="v">'+g.f+'</span><span class="s">Trace Crossings</span></div></div>';
}

function renderList(){
  var now=today(), next=null, html="";
  GAMES.forEach(function(g){ if(!g.off && !next && dt(g.d)>=now) next=g.d; });
  GAMES.forEach(function(g){
    var past=dt(g.d)<now;
    if(g.off){ html+='<div class="game'+(past?' past':'')+'" style="display:block"><div class="head"><span class="date">'+dateLabel(g)+'</span><h3>No games<span class="tag off">Off week</span></h3></div></div>'; return; }
    var more='';
    if(team){ var c=counts(g.d), sid=snackFor(g.d);
      more='<div class="more"><span>'+c.yes+' coming &middot; '+(sid?'&#127818; '+esc(nameOf(sid)):'&#127818; <b style="color:var(--fire)">snacks open</b>')+'</span><span class="go">Open &rsaquo;</span></div>'; }
    else more='<div class="more"><span>Field map and details</span><span class="go">Open &rsaquo;</span></div>';
    html+='<a class="game'+(past?' past':'')+(g.d===next?' is-next':'')+'" href="?g='+g.d+'"><div class="head"><span class="date">'+dateLabel(g)+(g.d===next?' &middot; <span style="color:var(--fire)">Next game</span>':'')+'</span>'+
      '<h3>'+(g.home?'vs ':'at ')+esc(g.opp)+(g.home?'<span class="tag home">Home</span>':'<span class="tag">Away</span>')+'</h3></div>'+tiles(g)+more+'</a>';
  });
  document.getElementById("list").innerHTML=html;
}

function mapSvg(f){
  var b=FIELD_BOXES[f]; if(!b) return '';
  var cx=b[0],cy=b[1],w=b[2],h=b[3],r=b[4];
  return '<svg viewBox="0 0 1355 1025" preserveAspectRatio="none" aria-hidden="true"><g transform="rotate('+r+' '+cx+' '+cy+')">'+
    '<rect class="hl" x="'+(cx-w/2)+'" y="'+(cy-h/2)+'" width="'+w+'" height="'+h+'" rx="6"/></g>'+'</svg>';
}

function renderDetail(g){
  var past=dt(g.d)<today();
  document.title=dateLabel(g)+" game · Fireballs U7";
  document.getElementById("h1").innerHTML=(g.home?'vs ':'at ')+'<em>'+esc(g.opp)+'</em>';
  document.getElementById("lede").textContent=dateLabel(g)+" · "+(g.home?"Home":"Away")+" · Trace Crossings";
  var html='<a class="backlink" href="./">&larr; All games</a>'+tiles(g)+
    '<div class="panel"><h3>Field '+g.f+' on the map</h3><div class="mapwrap"><img src="../field-map.jpg" width="1200" height="907" alt="Aerial map of the Trace Crossings fields with field '+g.f+' highlighted">'+mapSvg(g.f)+'</div>'+
    '<p class="intro" style="margin:.6rem 0 0;font-size:.85rem">Park in the lot off Learning Lane and take the path to the fields.</p></div>';
  if(team){
    var sid=snackFor(g.d), box;
    if(past) box=sid?'<div class="snackbox taken">&#127818; <b>'+esc(nameOf(sid))+'\'s family</b> brought snacks</div>':'<div class="snackbox taken">No snack sign-up for this game.</div>';
    else if(snackEdit===g.d){
      box='<div class="snackbox"><span class="lbl">Who\'s bringing snacks?</span><select data-snack="'+g.d+'" aria-label="Snack family"><option value="">Pick your player</option>'+
        team.players.map(function(p){var pre=sid?p.id===sid:((team.my_players||[])[0]===p.id);return '<option value="'+p.id+'"'+(pre?' selected':'')+'>'+esc(p.display)+'\'s family</option>';}).join("")+
        '</select><button type="button" class="btn sm" data-save="'+g.d+'">Save</button><button type="button" class="link" data-cancel>Cancel</button></div>';
    } else if(sid) box='<div class="snackbox taken">&#10003; <b>'+esc(nameOf(sid))+'\'s family</b> is bringing snacks <button type="button" class="link" data-edit="'+g.d+'">Change</button><button type="button" class="link" data-clear="'+g.d+'">Remove</button></div>';
    else box='<div class="snackbox"><span class="lbl">&#127818; Snacks needed</span><button type="button" class="btn sm" data-edit="'+g.d+'">Sign up to bring snacks</button></div>';
    html+='<div class="panel"><h3>Snacks</h3>'+box+'</div>';
    var c=counts(g.d), mine=team.my_players||[];
    var players=team.players.slice().sort(function(a,b){return (mine.indexOf(b.id)>=0)-(mine.indexOf(a.id)>=0);});
    html+='<div class="panel"><h3>Who\'s coming</h3><div class="counts rsvp-sum"><span class="pill y">'+c.yes+' coming</span><span class="pill m">'+c.maybe+' maybe</span><span class="pill n">'+c.no+' out</span><span class="pill">'+c.none+' no reply</span></div>'+
      '<div class="rsvp-list big">'+players.map(function(p){var s=rsvpFor(g.d,p.id);
        return '<div class="rsvp-row"><span>'+esc(p.display)+(mine.indexOf(p.id)>=0?'<span class="mine">YOURS</span>':'')+'</span>'+
          (past?'<span class="rsvp-sum">'+(s?({yes:"Came",maybe:"Maybe",no:"Out"})[s]:"")+'</span>':
          '<span class="seg" role="group" aria-label="RSVP for '+esc(p.display)+'">'+["yes","maybe","no"].map(function(v){return '<button type="button" data-s="'+v+'" data-pid="'+p.id+'" aria-pressed="'+(s===v)+'">'+({yes:"Yes",maybe:"Maybe",no:"No"})[v]+'</button>';}).join("")+'</span>')+
        '</div>';}).join("")+'</div></div>';
  }
  document.getElementById("detail").innerHTML=html;
}

function render(){ var g=current();
  document.getElementById("list").hidden=!!g; document.getElementById("detail").hidden=!g;
  if(g) renderDetail(g); else renderList(); }

document.addEventListener("click",function(e){
  var g=current(); if(!team||!g) return;
  var b=e.target.closest(".seg button");
  if(b){ var pid=+b.dataset.pid, s=b.dataset.s, cur=rsvpFor(g.d,pid), next=(cur===s)?null:s;
    post("rsvp",{game_date:g.d,player_id:pid,status:next}).then(function(){
      team.rsvps=team.rsvps.filter(function(r){return !(r.game_date===g.d&&r.player_id===pid);});
      if(next) team.rsvps.push({game_date:g.d,player_id:pid,status:next}); render(); toast("Saved");
    }).catch(function(){toast("Couldn't save. Try again.");}); return; }
  var t=e.target.closest("[data-edit],[data-save],[data-cancel],[data-clear]"); if(!t) return;
  function setSnack(pid){ post("snack",{game_date:g.d,player_id:pid}).then(function(){
      team.snacks=team.snacks.filter(function(x){return x.game_date!==g.d;}); if(pid) team.snacks.push({game_date:g.d,player_id:pid});
      snackEdit=null; render(); toast(pid?"Thanks! You're on snacks.":"Snack spot opened up"); }).catch(function(){toast("Couldn't save. Try again.");}); }
  if(t.dataset.edit){ snackEdit=g.d; render(); }
  else if(t.hasAttribute("data-cancel")){ snackEdit=null; render(); }
  else if(t.dataset.clear){ setSnack(null); }
  else if(t.dataset.save){ var v=+document.querySelector('select[data-snack="'+g.d+'"]').value; if(!v){toast("Pick your player first");return;} setSnack(v); }
});

render();
fetch(API+"team",{credentials:"same-origin",cache:"no-store"}).then(function(r){
  if(r.status===403){ location.replace("../account/?welcome=1"); return new Promise(function(){}); }
  if(!r.ok) throw new Error("x");
  return r.json();
}).then(function(d){ if(!(d.my_players||[]).length){ location.replace("../account/?welcome=1"); return; } document.documentElement.classList.remove("checking"); team=d; render(); })
.catch(function(err){ document.documentElement.classList.remove("checking");
  var n=document.getElementById("note"); n.hidden=false;
  document.getElementById("note-msg").innerHTML = (err&&err.message==="JOIN") ? 'Join the team on the <a href="../#team">team page</a> to RSVP and sign up for snacks.' : 'Couldn\'t load RSVPs and snacks. Refresh to try again.';
});
window.addEventListener("pageshow",function(e){ if(e.persisted) location.reload(); });
</script>
</body>
</html>
