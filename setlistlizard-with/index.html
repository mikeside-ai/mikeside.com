<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setlist Lizard ... With</title>
  <!-- The project itself lives at mikeside.com/projects/setlistlizard_with/.
       This folder exists only so setlistlizard-with.mikeside.com has somewhere
       to land: Porkbun's static hosting maps a subdomain to a directory, and a
       directory needs an index. Everything here is self-contained on purpose —
       under the subdomain the document root IS this folder, so /css/ and /js/
       from the main site are not reachable. -->
  <link rel="canonical" href="https://mikeside.com/projects/setlistlizard_with/" />
  <meta name="robots" content="noindex,follow" />
  <meta http-equiv="refresh" content="2;url=https://mikeside.com/projects/setlistlizard_with/" />
  <style>
    :root { --bg:#0d1117; --card:#161b26; --text:#e8eaf0; --muted:#8b93a7; --accent:#e0553a; --accent-soft:#f0765c; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:var(--bg); color:var(--text); text-align:center; padding:2rem;
           font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .wrap { max-width:30rem; }
    h1 { font-family:Fraunces,Georgia,serif; font-weight:600; font-size:clamp(1.6rem,6vw,2.3rem);
         margin:0 0 .5rem; letter-spacing:-.01em; }
    h1 .w { color:var(--accent-soft); }
    p { color:var(--muted); font-size:.95rem; line-height:1.7; margin:0 0 1.6rem; }
    a.go { display:inline-block; border:1px solid var(--accent); border-radius:12px;
           padding:.7rem 1.4rem; color:var(--accent-soft); text-decoration:none;
           font-size:.85rem; letter-spacing:.1em; text-transform:uppercase;
           transition:background .15s ease, color .15s ease; }
    a.go:hover { background:var(--accent); color:#fff; }
    .dots { color:var(--muted); letter-spacing:.35em; font-size:.8rem; margin-bottom:1.4rem; }
    .fine { margin:1.6rem 0 0; font-size:.72rem; letter-spacing:.06em; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Setlist Lizard <span class="w">... With</span></h1>
    <div class="dots">• • •</div>
    <p>Taking you to the setlists.</p>
    <a class="go" id="go" href="https://mikeside.com/projects/setlistlizard_with/">Go now →</a>
    <p class="fine">Setlist data: Phish.net · audio, durations, tags and banter: phish.in</p>
  </div>
  <script>
  (function () {
    var BASE = "https://mikeside.com/projects/setlistlizard_with";
    // Carry a deeper path through, but ONLY when we're actually being served as
    // the subdomain root — there, location.pathname is the visitor's path. If
    // this same file is ever reached at mikeside.com/setlistlizard-with/, the
    // pathname is the folder name instead, and appending it would send the
    // reader to a URL that doesn't exist. Go to the project root in that case.
    var onSub = /^setlistlizard-with\./.test(location.hostname);
    var p = onSub ? location.pathname.replace(/^\/+/, "") : "";
    var target = BASE + "/" + p + (onSub ? location.search + location.hash : "");
    document.getElementById("go").href = target;
    // replace(), not assign(), so Back doesn't bounce the reader in a loop.
    setTimeout(function () { location.replace(target); }, 350);
  })();
  </script>
</body>
</html>
