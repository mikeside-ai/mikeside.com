<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moved — Setlist Lizard ... With</title>
  <!-- Setlist Lizard moved from /projects/setlistlizard_with/ to
       /setlistlizard-with/ on 2026-07-27. This stub keeps shared links alive,
       the same way /projects/setlist/ was kept when the project was renamed.
       Don't delete it. Self-contained styling: it must not depend on anything
       that might move again. -->
  <link rel="canonical" href="https://mikeside.com/setlistlizard-with/" />
  <meta name="robots" content="noindex,follow" />
  <meta http-equiv="refresh" content="2;url=https://mikeside.com/setlistlizard-with/" />
  <style>
    :root { --bg:#0d1117; --text:#e8eaf0; --muted:#8b93a7; --accent:#e0553a; --accent-soft:#f0765c; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:var(--bg); color:var(--text); text-align:center; padding:2rem;
           font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .wrap { max-width:30rem; }
    h1 { font-family:Fraunces,Georgia,serif; font-weight:600; font-size:clamp(1.6rem,6vw,2.3rem);
         margin:0 0 .5rem; letter-spacing:-.01em; }
    h1 .w { color:var(--accent-soft); }
    p { color:var(--muted); font-size:.95rem; line-height:1.7; margin:0 0 1.6rem; }
    a.go { display:inline-block; border:1px solid var(--accent); border-radius:12px;
           padding:.7rem 1.4rem; color:var(--accent-soft); text-decoration:none;
           font-size:.85rem; letter-spacing:.1em; text-transform:uppercase;
           transition:background .15s ease, color .15s ease; }
    a.go:hover { background:var(--accent); color:#fff; }
    .dots { color:var(--muted); letter-spacing:.35em; font-size:.8rem; margin-bottom:1.4rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Setlist Lizard <span class="w">... With</span></h1>
    <div class="dots">• • •</div>
    <p>This moved to a shorter address. Taking you there.</p>
    <a class="go" id="go" href="https://mikeside.com/setlistlizard-with/">Go now →</a>
  </div>
  <script>
  (function () {
    var OLD = "/projects/setlistlizard_with";
    var NEW = "/setlistlizard-with";
    // Carry the rest of the path across, so an old deep link lands on the same
    // page at its new address rather than dumping the reader on the front page.
    var rest = location.pathname.indexOf(OLD) === 0 ? location.pathname.slice(OLD.length) : "/";
    var target = "https://mikeside.com" + NEW + (rest || "/") + location.search + location.hash;
    document.getElementById("go").href = target;
    // replace(), not assign(), so Back doesn't bounce the reader in a loop.
    setTimeout(function () { location.replace(target); }, 350);
  })();
  </script>
</body>
</html>
